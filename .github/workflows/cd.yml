name: CD

on:
  workflow_run:
    workflows: ["CI with Gradle"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/likelion
  DOCKER_NETWORK: centerton-net

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SSH로 서버에 접속해 배포
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e

            APP_HOME=/home/${{ secrets.SERVER_USER }}
            # 업로드 파일은 컨테이너 쓰기 레이어에 저장되므로 재배포마다 사라진다.
            # 사라지면 이전 대화의 imageUrl 이 404 가 되고, 사전문진 첨부도 함께 없어진다.
            CHAT_IMAGES="$APP_HOME/uploads/ai-chat-images"
            PRECONSULT_FILES="$APP_HOME/uploads/preconsult-submissions"

            echo "${{ secrets.ENV_FILE }}" > "$APP_HOME/.env"

            echo "[1/5] Pull latest Docker image..."
            docker pull ${{ env.IMAGE }}:latest

            # RAG 서비스와 같은 네트워크에 붙어야 http://centerton-rag:8001 이 해석된다.
            # Rag-Lab CD 가 먼저 만들지만, 배포 순서는 보장되지 않으므로 여기서도 보장한다.
            echo "[2/5] Ensure shared network and upload directories..."
            docker network create ${{ env.DOCKER_NETWORK }} || true
            mkdir -p "$CHAT_IMAGES" "$PRECONSULT_FILES"

            # 기존 컨테이너에만 있는 업로드 파일을 호스트로 건져낸다. 컨테이너를 rm 하면
            # 쓰기 레이어가 함께 사라지므로 이 시점이 마지막 기회다.
            # 호스트 디렉터리가 비어 있을 때만 실행한다. 볼륨을 붙인 뒤에는 컨테이너 경로가
            # 곧 이 디렉터리이므로, 조건 없이 복사하면 같은 파일을 자기 자신에게 덮어쓴다.
            echo "[3/5] Rescue uploads from the previous container..."
            if [ -z "$(ls -A "$CHAT_IMAGES" 2>/dev/null)" ] \
               && [ -n "$(docker ps -aq -f name=^likelion$)" ]; then
              docker cp likelion:/app/uploads/ai-chat-images/. "$CHAT_IMAGES/" 2>/dev/null || true
              docker cp likelion:/app/uploads/preconsult-submissions/. "$PRECONSULT_FILES/" 2>/dev/null || true
              echo "rescued chat images: $(ls -1 "$CHAT_IMAGES" 2>/dev/null | wc -l)"
            else
              echo "skipped (host directory already populated or no previous container)"
            fi

            echo "[4/5] Restart container with new image..."
            docker stop likelion || true
            docker rm likelion || true
            # JAVA_TOOL_OPTIONS: --memory 를 걸면 JVM 이 기본으로 그 25% 만 힙으로 잡는다.
            #   4GB 서버에서 RAG 컨테이너에 2g 를 주고 남은 몫이므로 비율을 올려 쓴다.
            docker run -d --name likelion \
              --network ${{ env.DOCKER_NETWORK }} \
              --env-file "$APP_HOME/.env" \
              -e JAVA_TOOL_OPTIONS="-XX:MaxRAMPercentage=70" \
              -v "$CHAT_IMAGES:/app/uploads/ai-chat-images" \
              -v "$PRECONSULT_FILES:/app/uploads/preconsult-submissions" \
              --memory 1300m \
              --restart unless-stopped \
              -p 8080:8080 \
              ${{ env.IMAGE }}:latest

            echo "[5/5] Cleanup unused images..."
            docker image prune -f