name: CD

on:
  workflow_run:
    workflows: ["CI with Gradle"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/likelion

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: /home/${{ secrets.SERVER_USER }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e

            APP_HOME=/home/${{ secrets.SERVER_USER }}
            cd $APP_HOME

            # .env 파일 배치 (GitHub Secrets에서)
            echo "${{ secrets.ENV_FILE }}" > "$APP_HOME/.env"

            echo "[1/4] Pull latest backend image..."
            docker pull ${{ env.IMAGE }}:latest

            echo "[2/4] Start services with docker compose..."
            docker compose up -d --force-recreate backend

            echo "[3/4] Wait for health check..."
            sleep 10
            docker compose ps

            echo "[4/4] Cleanup unused images..."
            docker image prune -f
