spring.application.name=centerton

# Local secret file. This file itself must not be committed.
spring.config.import=optional:application-secret.properties

# Datasource
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Server
server.servlet.context-path=/api

# JWT
jwt.secret=${JWT_SECRET_KEY}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION}

# CORS: comma-separated origins without a trailing slash
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Agora RTC / REST authentication
agora.app-id=${AGORA_APP_ID}
agora.app-certificate=${AGORA_APP_CERTIFICATE}
agora.customer-id=${AGORA_CUSTOMER_ID}
agora.customer-secret=${AGORA_CUSTOMER_SECRET}
agora.token-expiration-seconds=${AGORA_TOKEN_EXPIRATION_SECONDS:3600}

# Agora Real-Time STT
agora.stt.base-url=${AGORA_STT_BASE_URL:https://api.agora.io/api/speech-to-text/v1}
agora.stt.sub-bot-uid=${AGORA_STT_SUB_BOT_UID:900001}
agora.stt.pub-bot-uid=${AGORA_STT_PUB_BOT_UID:900002}
agora.stt.max-idle-time-seconds=${AGORA_STT_MAX_IDLE_TIME_SECONDS:120}

# Consultation Summary - Gemini
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}

# Consultation Summary - DeepL API Free
deepl.auth-key=${DEEPL_AUTH_KEY:}
deepl.base-url=${DEEPL_BASE_URL:https://api-free.deepl.com}
