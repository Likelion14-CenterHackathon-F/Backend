spring.application.name=centerton

# Local secret file. This file itself must not be committed.
spring.config.import=optional:application-secret.properties

# File storage
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.s3.region=${AWS_REGION:}
app.storage.s3.bucket=${AWS_S3_BUCKET:}

# Datasource
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Server
server.servlet.context-path=/api

# JWT
jwt.secret=${JWT_SECRET_KEY}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION}

# CORS: comma-separated origins/patterns without a trailing slash
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://allway.vercel.app,http://localhost:5173,https://kanage.vercel.app}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}

# Agora RTC / REST authentication
agora.app-id=${AGORA_APP_ID}
agora.app-certificate=${AGORA_APP_CERTIFICATE}
agora.customer-id=${AGORA_CUSTOMER_ID}
agora.customer-secret=${AGORA_CUSTOMER_SECRET}
agora.token-expiration-seconds=${AGORA_TOKEN_EXPIRATION_SECONDS:3600}

# Agora Real-Time STT
agora.stt.base-url=${AGORA_STT_BASE_URL:https://api.agora.io/api/speech-to-text/v1}
agora.stt.sub-bot-uid=${AGORA_STT_SUB_BOT_UID:900001}
agora.stt.pub-bot-uid=${AGORA_STT_PUB_BOT_UID:900002}
agora.stt.max-idle-time-seconds=${AGORA_STT_MAX_IDLE_TIME_SECONDS:120}

# Consultation Summary - Gemini
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:65536}

# Consultation Summary - DeepL API Free
deepl.auth-key=${DEEPL_AUTH_KEY:}
deepl.base-url=${DEEPL_BASE_URL:https://api-free.deepl.com}

# AI Chatbot - OpenAI
openai.api-key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
openai.model=${OPENAI_MODEL:gpt-5.6-luna}
openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:900}

# AI Chatbot - answer provider
# rag-service: Spring delegates answer generation to the FastAPI RAG service.
# openai: Spring calls OpenAI directly. Local/dev fallback with no retrieved
#   evidence, so it must be opted into explicitly. Defaulting to it would let a
#   deployment that forgets AI_CHAT_ANSWER_PROVIDER answer without any grounding
#   and without failing, which is the one outcome the product must not have.
ai-chat.answer.provider=${AI_CHAT_ANSWER_PROVIDER:rag-service}
ai-chat.rag-service.base-url=${AI_CHAT_RAG_SERVICE_BASE_URL:}
ai-chat.rag-service.path=${AI_CHAT_RAG_SERVICE_PATH:/v1/aftercare/answer}
ai-chat.emergency-rules.path=${AI_CHAT_EMERGENCY_RULES_PATH:classpath:rag/emergency_rules.json}

# AI Chatbot - image storage
ai-chat.image.storage.directory=${AI_CHAT_IMAGE_STORAGE_DIRECTORY:uploads/ai-chat-images}

# Pre-consultation submission files
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=260MB
preconsult-submission.storage.directory=${PRECONSULT_SUBMISSION_STORAGE_DIRECTORY:uploads/preconsult-submissions}
