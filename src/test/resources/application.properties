spring.datasource.url=jdbc:h2:mem:centerton;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=${random.uuid}${random.uuid}
jwt.access.expiration=3600000

agora.app-id=test-app-id
agora.app-certificate=${random.uuid}
agora.customer-id=test-customer-id
agora.customer-secret=${random.uuid}
